name: Terraform Destroy aks-centralus-prod

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy (dev, stage, prod)"
        required: true
        default: "dev"

permissions:
  id-token: write
  contents: read

jobs:
  terraform-destroy:
    runs-on: ubuntu-latest

    environment:
      name: ${{ github.event.inputs.environment }}
      url: https://portal.azure.com

    env:
      TF_WORKING_DIR: azure-terraform/aks-centralus-${{ github.event.inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Manual Approval Gate
      - name: Wait for approval
        uses: trstringer/manual-approval@v1
        with:
          approvers: ${{ secrets.APPROVERS }}
          minimum-approvals: 1
          issue-title: "Terraform Destroy Approval Required"
          issue-body: "Approve to destroy **${{ github.event.inputs.environment }}** environment."

      # Azure Login (OIDC)
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Force Terraform to use OIDC
      - name: Force Terraform to use OIDC
        shell: pwsh
        run: |
          "ARM_USE_OIDC=true" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ARM_DISABLE_CLI_AUTH=true" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ARM_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ARM_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ARM_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      # Terraform Init
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      # Terraform Destroy
      - name: Terraform Destroy
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform destroy -auto-approve -input=false -var-file="terraform.tfvars"