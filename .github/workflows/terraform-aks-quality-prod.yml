name: Terraform Quality Checks

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to check (dev, stage, prod)"
        required: true
        default: "dev"

permissions:
  id-token: write
  contents: read

jobs:
  terraform-quality:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        tool: [fmt, validate, tflint, tfsec, checkov]

    env:
      TF_WORKING_DIR: azure-terraform/aks-centralus-${{ github.event.inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      # 1. Terraform FMT
      - name: Terraform Fmt
        if: matrix.tool == 'fmt'
        continue-on-error: true
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive | tee terraform-fmt-report.txt

      # 2. Terraform Validate
      - name: Terraform Init
        if: matrix.tool == 'validate'
        continue-on-error: true
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend=false

      - name: Terraform Validate
        if: matrix.tool == 'validate'
        continue-on-error: true
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate | tee terraform-validate-report.txt

      # 3. TFLint
      - name: Install tflint
        if: matrix.tool == 'tflint'
        continue-on-error: true
        run: |
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash

      - name: Run tflint
        if: matrix.tool == 'tflint'
        continue-on-error: true
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: tflint --recursive | tee tflint-report.txt

      # 4. TFSEC
      - name: Run tfsec
        if: matrix.tool == 'tfsec'
        continue-on-error: true
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ env.TF_WORKING_DIR }}
          format: json
          output_file: tfsec-report.json

      # 5. Checkov
      - name: Install Checkov
        if: matrix.tool == 'checkov'
        continue-on-error: true
        run: pip install checkov

      - name: Run Checkov
        if: matrix.tool == 'checkov'
        continue-on-error: true
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: checkov -d . --quiet --soft-fail | tee checkov-report.txt

      # Upload All Reports
      - name: Upload Quality Reports
        uses: actions/upload-artifact@v4
        with:
          name: terraform-quality-reports-${{ github.event.inputs.environment }}
          path: |
            ${{ env.TF_WORKING_DIR }}/terraform-fmt-report.txt
            ${{ env.TF_WORKING_DIR }}/terraform-validate-report.txt
            ${{ env.TF_WORKING_DIR }}/tflint-report.txt
            ${{ env.TF_WORKING_DIR }}/tfsec-report.json
            ${{ env.TF_WORKING_DIR }}/checkov-report.txt