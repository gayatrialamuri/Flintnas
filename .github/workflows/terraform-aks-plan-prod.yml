name: Terraform Plan - AKS Central US - Prod

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to plan (dev, stage, prod)"
        required: true
        default: "dev"

permissions:
  id-token: write
  contents: read

jobs:
  terraform-plan:
    runs-on: ubuntu-latest

    env:
      TF_WORKING_DIR: azure-terraform/aks-centralus-${{ github.event.inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Azure Login (OIDC)
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Force Terraform to use OIDC (not Azure CLI)
      - name: Force Terraform to use OIDC
        shell: pwsh
        run: |
          "ARM_USE_OIDC=true" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ARM_DISABLE_CLI_AUTH=true" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ARM_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ARM_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ARM_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      # Terraform Init
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      # Terraform Plan
      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -out=tfplan -var-file="terraform.tfvars"

      # Upload Plan Artifact
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.event.inputs.environment }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan